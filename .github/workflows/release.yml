name: Publish Addon to CurseForge

# Runs when a version tag is pushed, like v3.10.0. A tag with "beta" or "alpha" in it, like v3.10.0-beta1,
# goes up as a beta or alpha file. Needs the secret CF_API_KEY (a CurseForge API token) and the project id
# in ## X-Curse-Project-ID in Crescendo.toc.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # lets the packager create a GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the packager can build a changelog

      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^## Version: *//p' Crescendo.toc | tr -d '\r')"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ## Version: $version in Crescendo.toc"
            exit 1
          fi

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
